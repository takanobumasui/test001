<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>glitch or mosaic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 16px 24px;
    }
    header h1 { font-size: 18px; font-weight: 700; font-family: 'Fira Code', monospace; }
    header h1 span { color: #007aff; }

    .layout {
      display: flex;
      min-height: calc(100vh - 57px);
    }

    .panel {
      width: 280px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e5e5ea;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 10px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:active { opacity: .7; }
    .btn-dark { background: #1c1c1e; color: #fff; }
    .btn-gray { background: #f2f2f7; color: #1c1c1e; margin-top: 8px; }
    .btn-blue { background: #007aff; color: #fff; }

    .mode-row { display: flex; gap: 8px; }
    .mode-row .btn { flex: 1; margin-top: 0; font-size: 15px; padding: 12px; }

    .save-row { display: flex; gap: 8px; margin-top: 8px; }
    .save-row .btn { flex: 1; margin-top: 0; font-size: 13px; }

    .slider-row { display: flex; flex-direction: column; gap: 6px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 13px; }
    .slider-header .val { font-weight: 600; color: #007aff; }

    input[type=range] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #e5e5ea;
      border-radius: 2px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #007aff;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
      cursor: pointer;
    }

    .params { display: flex; flex-direction: column; gap: 16px; }

    #fileInput { display: none; }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: #007aff; cursor: pointer; }

    .status-badge {
      font-size: 11px;
      color: #007aff;
      font-family: 'Fira Code', monospace;
      min-height: 16px;
    }

    /* ---- Canvas area ---- */
    .canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #f2f2f7;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      border-radius: 10px;
      box-shadow: 0 4px 28px rgba(0,0,0,.13);
    }

    .drop-hint {
      width: 460px;
      height: 340px;
      border: 2px dashed #c7c7cc;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #8e8e93;
      font-size: 15px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-hint:hover, .drop-hint.over {
      border-color: #007aff;
      background: #f0f6ff;
    }
    .drop-hint svg { opacity: .35; }
    .drop-hint small { font-size: 12px; color: #c7c7cc; }

    @media (max-width: 680px) {
      .layout { flex-direction: column; }
      .panel { width: 100%; border-right: none; border-bottom: 1px solid #e5e5ea; }
      .canvas-area { padding: 16px; }
      .drop-hint { width: 100%; height: 200px; }
    }
  </style>
</head>
<body>

<header>
  <h1>glitch <span>or</span> mosaic</h1>
</header>

<div class="layout">

  <div class="panel">

    <!-- 画像操作 -->
    <div>
      <div class="section-label">画像操作</div>
      <button class="btn btn-dark" onclick="document.getElementById('fileInput').click()">
        ＋ 画像をアップロード
      </button>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn btn-gray" onclick="rotateImage()">回転 90° ↻</button>
    </div>

    <!-- エフェクト選択 -->
    <div>
      <div class="section-label">エフェクト</div>
      <div class="mode-row">
        <button class="btn btn-blue" id="btnGlitch" onclick="setMode('glitch')">グリッチ</button>
        <button class="btn btn-gray" id="btnMosaic" onclick="setMode('mosaic')">モザイク</button>
      </div>
    </div>

    <!-- パラメータ -->
    <div>
      <div class="section-label">パラメータ</div>
      <div class="params">
        <div id="paramIntensity" class="slider-row">
          <div class="slider-header">
            <span>強度</span><span class="val" id="intensityVal">50%</span>
          </div>
          <input type="range" id="intensity" min="0" max="100" value="50">
        </div>
        <div id="paramSlices" class="slider-row">
          <div class="slider-header">
            <span>スライス数</span><span class="val" id="slicesVal">5</span>
          </div>
          <input type="range" id="slices" min="1" max="20" value="5">
        </div>
        <div id="paramBalance" class="slider-row">
          <div class="slider-header">
            <span>バランス</span>
            <span class="val" id="balanceVal">均等</span>
          </div>
          <input type="range" id="balance" min="0" max="100" value="50">
        </div>
        <div id="paramBlock" class="slider-row" style="display:none">
          <div class="slider-header">
            <span>ブロックサイズ</span><span class="val" id="blockVal">20px</span>
          </div>
          <input type="range" id="block" min="2" max="80" value="20">
        </div>
      </div>
    </div>

    <!-- 表示設定 -->
    <div>
      <div class="section-label">表示設定</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <label style="display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer">
          <span>グリッドを表示</span>
          <input type="checkbox" id="showGrid" checked>
        </label>
        <label style="display:flex;justify-content:space-between;align-items:center;font-size:13px;cursor:pointer">
          <span>ラベルを表示</span>
          <input type="checkbox" id="showLabels" checked>
        </label>
      </div>
      <div id="detectionStatus" class="status-badge" style="margin-top:8px"></div>
    </div>

    <!-- 保存 -->
    <div>
      <div class="section-label">保存</div>
      <button class="btn btn-dark" onclick="saveImage()">画像を保存 / 共有</button>
      <div class="save-row">
        <button class="btn btn-gray" onclick="exportImg('png')">PNG</button>
        <button class="btn btn-gray" onclick="exportImg('jpg')">JPG</button>
      </div>
    </div>

  </div>

  <!-- キャンバス -->
  <div class="canvas-area" id="dropZone">
    <canvas id="canvas" style="display:none"></canvas>
    <div class="drop-hint" id="dropHint" onclick="document.getElementById('fileInput').click()">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>画像をドロップ、またはタップして選択</span>
      <small>JPEG / PNG / WebP 対応</small>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
let srcCanvas = document.createElement('canvas');
let srcCtx    = srcCanvas.getContext('2d');
let originalImage = null;
let rotation  = 0;
let currentMode = 'glitch';
let labelPositions = [];

// ---- COCO-SSD model ----
let cocoModel = null;

async function ensureModel() {
  if (cocoModel) return cocoModel;
  setStatus('AIモデル読み込み中...');
  cocoModel = await cocoSsd.load({ base: 'mobilenet_v2' });
  return cocoModel;
}

async function detectObjects() {
  setStatus('解析中...');
  try {
    const model = await ensureModel();
    const W = srcCanvas.width, H = srcCanvas.height;

    // 検出用に最大640pxに縮小してメモリを節約
    const MAX = 640;
    const scale = Math.min(1, MAX / Math.max(W, H));
    const dW = Math.round(W * scale), dH = Math.round(H * scale);
    let detCanvas = srcCanvas;
    if (scale < 1) {
      detCanvas = document.createElement('canvas');
      detCanvas.width = dW; detCanvas.height = dH;
      detCanvas.getContext('2d').drawImage(srcCanvas, 0, 0, dW, dH);
    }

    const preds = await model.detect(detCanvas);
    labelPositions = preds.map(p => ({
      fx: p.bbox[0] / dW,
      fy: p.bbox[1] / dH,
      fw: p.bbox[2] / dW,
      fh: p.bbox[3] / dH,
      label: p.class.toUpperCase(),
      score: Math.round(p.score * 100)
    }));
    setStatus(preds.length ? `${preds.length}個を検出` : '検出なし');
  } catch (e) {
    console.error(e);
    labelPositions = [];
    setStatus('検出エラー');
  }
  applyEffect();
}

function setStatus(msg) {
  document.getElementById('detectionStatus').textContent = msg;
}

const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

// ---- File load ----
document.getElementById('fileInput').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

const dropZone = document.getElementById('dropZone');
const dropHint = document.getElementById('dropHint');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropHint.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropHint.classList.remove('over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropHint.classList.remove('over');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    originalImage = img;
    rotation = 0;
    labelPositions = [];
    drawToSrc();
    detectObjects();
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function drawToSrc() {
  if (!originalImage) return;
  const w = originalImage.width, h = originalImage.height;
  const rad = (rotation * Math.PI) / 180;
  const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
  srcCanvas.width  = Math.round(w * cos + h * sin);
  srcCanvas.height = Math.round(w * sin + h * cos);
  srcCtx.save();
  srcCtx.translate(srcCanvas.width / 2, srcCanvas.height / 2);
  srcCtx.rotate(rad);
  srcCtx.drawImage(originalImage, -w / 2, -h / 2);
  srcCtx.restore();
  applyEffect();
}

function rotateImage() {
  rotation = (rotation + 90) % 360;
  labelPositions = [];
  drawToSrc();
  detectObjects();
}

// ---- Mode ----
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btnGlitch').className = mode === 'glitch' ? 'btn btn-blue' : 'btn btn-gray';
  document.getElementById('btnMosaic').className = mode === 'mosaic' ? 'btn btn-blue' : 'btn btn-gray';
  const isGlitch = mode === 'glitch';
  document.getElementById('paramIntensity').style.display = isGlitch ? '' : 'none';
  document.getElementById('paramSlices').style.display    = isGlitch ? '' : 'none';
  document.getElementById('paramBalance').style.display   = isGlitch ? '' : 'none';
  document.getElementById('paramBlock').style.display     = isGlitch ? 'none' : '';
  applyEffect();
}

// ---- Effects ----
function applyEffect() {
  if (!originalImage) return;
  const W = srcCanvas.width, H = srcCanvas.height;
  if (!W || !H) return;

  canvas.width  = W;
  canvas.height = H;
  canvas.style.display = 'block';
  dropHint.style.display = 'none';

  const srcData = srcCtx.getImageData(0, 0, W, H);

  if (currentMode === 'glitch') {
    effectGlitch(srcData, getVal('intensity') / 100, getVal('slices'), getVal('balance') / 100);
  } else {
    effectMosaic(srcData, getVal('block'));
  }

  if (document.getElementById('showGrid').checked)   drawGrid(W, H);
  if (document.getElementById('showLabels').checked) drawLabels(W, H);
}

function effectGlitch(srcData, intensity, sliceCount, balance) {
  const W = canvas.width, H = canvas.height;
  ctx.putImageData(srcData, 0, 0);
  for (let i = 0; i < sliceCount; i++) {
    const y  = Math.random() * H;
    const h  = (Math.random() * H / sliceCount) * 2;
    const sx = (Math.random() - 0.5) * W * intensity * 0.5 * (balance >= 0.5 ? (balance - 0.5) * 2 : 0.1);
    const sy = (Math.random() - 0.5) * H * intensity * 0.3 * (balance <= 0.5 ? (0.5 - balance) * 2 : 0.1);
    ctx.putImageData(ctx.getImageData(0, y, W, h), sx, y + sy);
  }
  if (intensity > 0.15) {
    const shift = intensity * 18;
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.18 * intensity;
    ctx.drawImage(canvas,  shift, 0);
    ctx.drawImage(canvas, -shift, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

function effectMosaic(srcData, size) {
  const W = canvas.width, H = canvas.height;
  const d = srcData.data;
  ctx.clearRect(0, 0, W, H);
  for (let y = 0; y < H; y += size) {
    for (let x = 0; x < W; x += size) {
      const sx = Math.min(x + Math.floor(size / 2), W - 1);
      const sy = Math.min(y + Math.floor(size / 2), H - 1);
      const i  = (sy * W + sx) * 4;
      ctx.fillStyle = `rgb(${d[i]},${d[i+1]},${d[i+2]})`;
      ctx.fillRect(x, y, size, size);
    }
  }
}

// ---- Grid overlay ----
function drawGrid(W, H) {
  const cols = 8, rows = 8;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 0.5;
  for (let c = 1; c < cols; c++) {
    ctx.beginPath(); ctx.moveTo(W / cols * c, 0); ctx.lineTo(W / cols * c, H); ctx.stroke();
  }
  for (let r = 1; r < rows; r++) {
    ctx.beginPath(); ctx.moveTo(0, H / rows * r); ctx.lineTo(W, H / rows * r); ctx.stroke();
  }
  ctx.restore();
}

// ---- Detection Labels overlay ----
function drawLabels(W, H) {
  if (!labelPositions.length) return;
  ctx.save();
  ctx.font = 'bold 20px "Fira Code", monospace';

  labelPositions.forEach(({ fx, fy, fw, fh, label, score }) => {
    const x = fx * W, y = fy * H, w = fw * W, h = fh * H;

    // Bounding box
    ctx.strokeStyle = 'rgba(0, 230, 120, 0.9)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    // Corner accent
    const cs = Math.min(w, h, 20);
    ctx.strokeStyle = '#00e678';
    ctx.lineWidth = 3;
    ['tl','tr','bl','br'].forEach(corner => {
      const cx = corner.includes('l') ? x : x + w;
      const cy = corner.includes('t') ? y : y + h;
      const dx = corner.includes('l') ? cs : -cs;
      const dy = corner.includes('t') ? cs : -cs;
      ctx.beginPath();
      ctx.moveTo(cx + dx, cy); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + dy);
      ctx.stroke();
    });

    // Label pill
    const text = `${label}  ${score}%`;
    const tw = ctx.measureText(text).width + 14;
    const lx = x, ly = y > 32 ? y - 32 : y + h + 2;
    ctx.fillStyle = 'rgba(0, 230, 120, 0.9)';
    ctx.beginPath();
    ctx.roundRect(lx, ly, tw, 28, 4);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.fillText(text, lx + 7, ly + 20);
  });

  ctx.restore();
}

// ---- Sliders ----
function getVal(id) { return parseInt(document.getElementById(id).value, 10); }

function wire(id, labelId, fmt) {
  document.getElementById(id).addEventListener('input', function() {
    document.getElementById(labelId).textContent = fmt(this.value);
    scheduleRender();
  });
}

wire('intensity', 'intensityVal', v => v + '%');
wire('slices',    'slicesVal',    v => v);
wire('balance',   'balanceVal',   v => {
  const n = Math.round(v);
  return n === 50 ? '均等' : n > 50 ? `垂直 ${n}%` : `水平 ${100 - n}%`;
});
wire('block', 'blockVal', v => v + 'px');

['showGrid','showLabels'].forEach(id =>
  document.getElementById(id).addEventListener('change', scheduleRender)
);

let renderTimer = null;
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(applyEffect, 30);
}

// ---- Save ----
async function saveImage() {
  if (!originalImage) return;
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'effect.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: '画像エフェクト' }); }
      catch (e) { if (e.name !== 'AbortError') exportImg('jpg'); }
    } else {
      exportImg('jpg');
    }
  }, 'image/jpeg', 0.92);
}

function exportImg(type) {
  if (!originalImage) return;
  const a = document.createElement('a');
  a.download = `effect.${type}`;
  a.href = canvas.toDataURL(type === 'png' ? 'image/png' : 'image/jpeg', 0.92);
  a.click();
}
</script>
</body>
</html>
